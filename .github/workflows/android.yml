name: Android CI
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Firebase configuration
        run: test -s app/google-services.json
      - name: Build Android app
        run: gradle lintDebug assembleDebug --stacktrace
      - name: Prepare installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Customer-Care-v2.0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Customer-Care-v2.0.1-APK-extract-before-sharing
          path: Customer-Care-v2.0.1.apk
          if-no-files-found: error
      - name: Publish direct APK in GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release view customer-care-latest >/dev/null 2>&1 || gh release create customer-care-latest --target "$GITHUB_SHA" --title "Customer Care — Latest APK" --notes "Download the .apk asset directly. Do not share the source-code ZIP or Actions artifact ZIP."
          gh release upload customer-care-latest "Customer-Care-v2.0.1.apk" --clobber
